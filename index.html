<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign Hunt | Control</title>
    <style>
        body { background: #050505; color: #c0c0c0; font-family: 'Playfair Display', serif; }
        .container { max-width: 600px; margin: 40px auto; padding: 20px; border: 1px solid #333; }
        textarea, input { width: 100%; margin: 10px 0; background: #111; border: 1px solid #444; color: white; padding: 10px; }
        button { width: 100%; padding: 15px; background: #7a0000; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>

<div class="container" id="app-root">
    <h1>The Hunt</h1>
    <div id="dynamic-survey"></div>
    <input type="file" id="file-offering">
    <button onclick="submitOffering()">Submit Offering</button>
</div>

<script type="module">
    import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

    // Power-based dynamic question pool
    const getQuestions = (score) => {
        const base = ["What part of your old self are you destroying today?", "Why do you seek to be noticed by the pack?"];
        const advanced = ["What weakness have you mastered since your last submission?", "How are you using your progress to intimidate your rivals?"];
        return score > 20 ? advanced : base;
    };

    window.submitOffering = async () => {
        const fileInput = document.getElementById('file-offering');
        const file = fileInput.files[0];
        
        if (!file) return alert("You must provide a visual offering.");

        try {
            // Re-initialized pathing to ensure stability
            const storageRef = sRef(getStorage(), 'offerings/' + Date.now() + "_" + file.name);
            
            // Explicit upload process
            const snapshot = await uploadBytes(storageRef, file);
            const url = await getDownloadURL(snapshot.ref);
            
            // Firebase DB Record
            await set(ref(getDatabase(), 'offerings/' + Date.now()), {
                user: "current_user_placeholder",
                url: url,
                timestamp: Date.now()
            });
            
            alert("Offering successfully received by the ALPHA.");
        } catch (error) {
            console.error("Submission failed:", error);
            alert("Submission failed. Ensure the file is not corrupted.");
        }
    };
</script>
</body>
</html>
