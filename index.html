<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Sovereign Hunt</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Playfair+Display:ital,wght@1,400;1,700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-deep: #050505; --accent-crimson: #7a0000; --accent-glow: #ff1a1a; --text-silver: #c0c0c0; }
        body { margin: 0; padding: 0; background-color: var(--bg-deep); background-image: radial-gradient(circle at center, #1a0000, #050505); background-attachment: fixed; color: var(--text-silver); font-family: 'Playfair Display', serif; display: flex; justify-content: center; min-height: 100vh; padding-top: 40px; }
        
        /* The Moon/Wolf Icon */
        .moon-icon { width: 120px; height: 120px; margin: 0 auto 20px; position: relative; }
        
        .container { background: rgba(10, 10, 15, 0.9); border: 1px solid #333; border-radius: 8px; padding: 30px; width: 95%; max-width: 600px; box-shadow: 0 0 30px rgba(0,0,0,0.8); }
        h1 { font-family: 'Cinzel', serif; color: var(--accent-crimson); text-align: center; text-transform: uppercase; text-shadow: 2px 2px 10px #000; }
        input, textarea { width: 100%; padding: 12px; margin: 10px 0; background: #000; border: 1px solid #333; color: var(--text-silver); box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #1a0000; border: 1px solid var(--accent-crimson); color: white; cursor: pointer; margin-top: 10px; font-family: 'Cinzel', serif; }
        button:hover { background: var(--accent-crimson); }
        .post-card { background: #080808; border: 1px solid #222; padding: 15px; margin: 10px 0; }
        .hidden { display: none; }
        .proactivity-meter { height: 10px; background: #222; margin: 20px 0; border-radius: 5px; }
        .meter-fill { height: 100%; background: var(--accent-crimson); width: 0%; transition: width 0.5s; }
    </style>
</head>
<body>

<div class="container" id="login-screen">
    <div class="moon-icon">
        <svg viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="45" fill="#e0e0e0" />
            <path d="M50 20 Q 65 20, 70 35 Q 75 50, 60 65 Q 45 70, 30 60 Q 20 45, 35 30 Z" fill="#333" />
            <path d="M40 80 L 50 40 L 60 80 Z" fill="#000" /> </svg>
    </div>
    <h1>The Sovereign Hunt</h1>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button onclick="handleLogin()">Ascend</button>
</div>

<div class="container hidden" id="alpha-dashboard">
    <h1>ALPHA SANCTUM</h1>
    <div id="user-management">
        <h3>Pack Management</h3>
        <div id="user-list"></div>
    </div>
    <div id="pending-offerings">
        <h3>Pending Offerings</h3>
        <div id="alpha-pending-content"></div>
    </div>
    <button onclick="logout()">Logout</button>
</div>

<div class="container hidden" id="user-dashboard">
    <h1 id="welcome-user">Subject</h1>
    <div class="proactivity-meter"><div class="meter-fill" id="meter"></div></div>
    <p style="text-align:center; font-size: 12px;">Proactivity Level: <span id="p-text">0%</span></p>

    <div class="post-card">
        <h3>Ritual Offering</h3>
        <input type="file" id="file-upload" accept="image/*,video/*">
        <textarea id="offering-desc" placeholder="Explain your progress..."></textarea>
        <button onclick="uploadOffering()">Submit Offering</button>
    </div>
    <button onclick="logout()">Logout</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, onValue, remove, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCO-n3z7eN3Xj1zmISJJxZvjyER9GBVnLc",
        authDomain: "sovereignhunt.firebaseapp.com",
        databaseURL: "https://sovereignhunt-default-rtdb.firebaseio.com",
        projectId: "sovereignhunt",
        storageBucket: "sovereignhunt.firebasestorage.app",
        messagingSenderId: "657296200169",
        appId: "1:657296200169:web:22a0f9364344e682083b78"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const storage = getStorage(app);

    let currentUser = null;

    window.handleLogin = function() {
        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value;
        if(u === 'ALPHA' && p === 'Football') {
            currentUser = 'ALPHA';
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('alpha-dashboard').classList.remove('hidden');
            initAlpha();
        } else {
            currentUser = u;
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('user-dashboard').classList.remove('hidden');
            document.getElementById('welcome-user').innerText = `Subject: ${u}`;
        }
    };

    window.uploadOffering = async function() {
        const file = document.getElementById('file-upload').files[0];
        const desc = document.getElementById('offering-desc').value;
        if(!file) return alert("Select a file.");

        const storageRef = sRef(storage, 'offerings/' + Date.now() + file.name);
        await uploadBytes(storageRef, file);
        const url = await getDownloadURL(storageRef);
        
        push(ref(db, 'offerings'), {
            user: currentUser,
            url: url,
            desc: desc,
            status: 'pending'
        });
        alert("Offering submitted. Your proactivity is noted.");
    };

    function initAlpha() {
        onValue(ref(db, 'offerings'), (snap) => {
            const data = snap.val();
            const list = document.getElementById('alpha-pending-content');
            list.innerHTML = '';
            if(data) Object.keys(data).forEach(k => {
                list.innerHTML += `<div class="post-card">From: ${data[k].user}<br><a href="${data[k].url}" target="_blank">View File</a></div>`;
            });
        });

        // List Users for deletion
        onValue(ref(db, 'users'), (snap) => {
            const users = snap.val();
            const div = document.getElementById('user-list');
            div.innerHTML = '';
            if(users) Object.keys(users).forEach(u => {
                div.innerHTML += `<div>${u} <button onclick="deleteUser('${u}')">Exile</button></div>`;
            });
        });
    }

    window.deleteUser = function(user) {
        if(confirm(`Exile ${user} from the pack?`)) {
            remove(ref(db, 'users/' + user));
        }
    };

    window.logout = () => location.reload();
</script>
</body>
</html>
